<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- 简约手绘风格皮皮虾 -->
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 身体 - 流线型 -->
  <ellipse cx="60" cy="55" rx="45" ry="30"
           fill="url(#bodyGrad)"
           stroke="#fbbf24"
           stroke-width="3"/>

  <!-- 头部 -->
  <circle cx="30" cy="45" r="22"
          fill="url(#bodyGrad)"
          stroke="#fbbf24"
          stroke-width="3"/>

  <!-- 眼睛 -->
  <circle cx="22" cy="40" r="6" fill="white" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="20" cy="38" r="3" fill="#1e293b"/>

  <!-- 长须 -->
  <path d="M 12 45 Q 5 40, 8 50"
        fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 触须 -->
  <path d="M 15 55 Q 10 62, 15 65"
        fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- 尾部 -->
  <path d="M 100 55 Q 115 45, 110 60 Q 115 70, 100 65"
        fill="url(#bodyGrad)" stroke="#fbbf24" stroke-width="3"/>

  <!-- 腿 -->
  <path d="M 40 70 Q 35 85, 40 90"
        fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 60 75 Q 55 90, 60 95"
        fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 80 70 Q 85 85, 80 90"
        fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 金色点缀 -->
  <circle cx="105" cy="55" r="2.5" fill="#fbbf24"/>
  <circle cx="102" cy="62" r="2" fill="#fbbf24"/>
</svg>
