<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" style="background: transparent;">
  <!-- 简约皮皮虾图标 -->
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 身体 -->
  <ellipse cx="25" cy="25" rx="18" ry="12"
           fill="url(#iconGradient)"
           stroke="#fbbf24"
           stroke-width="2"/>

  <!-- 眼睛 -->
  <circle cx="18" cy="22" r="3" fill="white" stroke="#fbbf24" stroke-width="1"/>
  <circle cx="17" cy="21" r="1.5" fill="#1e293b"/>

  <!-- 触须 -->
  <path d="M 12 25 C 8 22, 6 20, 5 25"
        fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 尾巴 -->
  <path d="M 40 25 C 45 20, 48 25, 45 30"
        fill="url(#iconGradient)" stroke="#fbbf24" stroke-width="2"/>
</svg>
